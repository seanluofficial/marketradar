[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-structure-radar"
version = "0.1.0"
description = "Unsupervised market-structure analytics: filtered correlation networks, MST/hierarchical clustering, and an absorption-ratio systemic-risk index."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pyarrow>=14.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "matplotlib>=3.8"]
dev = ["pytest>=7.4"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
